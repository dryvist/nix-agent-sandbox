name: Build agent image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Intentionally non-negotiable: a Nix image build past 20 minutes is a
    # dependency or closure regression. Do not raise this cap; fix the root
    # cause so the failed required check blocks the regression instead.
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CI flake checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          bash scripts/ci-check-scope.sh "$EVENT_NAME" "$GIT_REF" "${changed[@]}"

      - name: Verify CI scope contract
        run: bash tests/ci-check-scope.sh

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ matrix.arch }}-
          gc-max-store-size-linux: 6G
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Full flake suite
        if: steps.scope.outputs.full == 'true'
        run: nix flake check -L

      - name: Focused flake checks
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.targets != ''
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          system=x86_64-linux
          [[ "$ARCH" == arm64 ]] && system=aarch64-linux
          IFS=, read -r -a targets <<< "$TARGETS"
          attrs=()
          for target in "${targets[@]}"; do
            attrs+=(".#checks.${system}.${target}")
          done
          nix build -L "${attrs[@]}"

      - name: Build image
        if: steps.scope.outputs.image == 'true'
        run: nix build -L .#agent-image

      - name: Load image
        if: steps.scope.outputs.image == 'true'
        run: ./result | docker load

      - name: Smoke-test image as non-root
        if: steps.scope.outputs.image == 'true'
        run: nix develop --command bats tests/agent-image-smoke.bats

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag ghcr.io/dryvist/nix-agent-sandbox/agent:latest \
            "ghcr.io/dryvist/nix-agent-sandbox/agent:latest-$ARCH"
          docker push "ghcr.io/dryvist/nix-agent-sandbox/agent:latest-$ARCH"

  manifest:
    name: Multi-arch manifest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - name: Create and push manifest
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker manifest create ghcr.io/dryvist/nix-agent-sandbox/agent:latest \
            ghcr.io/dryvist/nix-agent-sandbox/agent:latest-amd64 \
            ghcr.io/dryvist/nix-agent-sandbox/agent:latest-arm64
          docker manifest push ghcr.io/dryvist/nix-agent-sandbox/agent:latest
